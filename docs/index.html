<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Wallet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1120;--side:#101827;--card:#172235;--card2:#1D2939;--border:#293548;
  --green:#16A36A;--green2:#22C58B;--red:#EF5350;--blue:#3B82F6;
  --text:#F8FAFC;--text2:#94A3B8;--muted:#64748B;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 13.5px/1.45 Inter,system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:var(--text)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:224px;flex:none;background:var(--side);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;transition:width .15s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--green);display:grid;place-items:center;flex:none}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text2);white-space:nowrap;overflow:hidden}
.nav a:hover{background:var(--card);text-decoration:none;color:var(--text)}
.nav a.active{background:rgba(22,163,106,.14);color:var(--green2)}
.nav svg{width:17px;height:17px;flex:none}
.nav .badge{margin-left:auto;background:var(--green);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600}
.side .foot{margin-top:auto;color:var(--muted);font-size:11px;padding:8px;line-height:1.4}
.collapse-btn{margin-top:8px;background:none;border:1px solid var(--border);border-radius:8px;padding:6px;color:var(--text2);cursor:pointer}
.app.collapsed .side{width:64px}.app.collapsed .side .lbl,.app.collapsed .side .foot,.app.collapsed .brand span,.app.collapsed .nav .badge{display:none}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 24px;background:rgba(11,17,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;cursor:pointer}
.search{position:relative;flex:1;max-width:460px}
.search input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 12px}
.search input:focus{outline:2px solid var(--blue);outline-offset:-1px}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card2);border:1px solid var(--border);border-radius:10px;max-height:360px;overflow:auto;display:none;z-index:30}
.results a{display:block;padding:8px 12px;color:var(--text);border-bottom:1px solid var(--border)}
.results a:hover{background:var(--card);text-decoration:none}
.results small{color:var(--muted);display:block}
.status{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:12px;margin-left:auto;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--green2);box-shadow:0 0 0 0 rgba(34,197,139,.6);animation:pulse 2s infinite}
.dot.delayed{background:#F59E0B}.dot.err{background:var(--red)}
@keyframes pulse{70%{box-shadow:0 0 0 6px rgba(34,197,139,0)}100%{box-shadow:0 0 0 0 rgba(34,197,139,0)}}
.bell{position:relative;background:none;border:1px solid var(--border);border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--text2)}
.bell .count{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;display:none}
.content{padding:22px 24px 48px;max-width:1440px;width:100%}
h1{font-size:26px;font-weight:700;margin:0 0 4px}
.desc{color:var(--text2);margin:0 0 18px}
h2{font-size:18px;font-weight:600;margin:0}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h3{font-size:14px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3 .right{margin-left:auto;font-weight:400;font-size:12px}
.stat .v{font-size:24px;font-weight:700}
.stat .l{color:var(--text2);font-size:12px;margin-top:2px}
.stat .t{color:var(--muted);font-size:11px;margin-top:8px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.pos{color:var(--green2)}.neg{color:var(--red)}.mut{color:var(--muted)}.sec{color:var(--text2)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;border:1px solid var(--border);white-space:nowrap}
.pill.buy{color:var(--green2);border-color:rgba(34,197,139,.4)}
.pill.sell{color:var(--red);border-color:rgba(239,83,80,.4)}
.pill.out{color:var(--text);background:var(--card2)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{color:var(--text2);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;cursor:default;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td.r,th.r{text-align:right}
tbody tr:hover{background:rgba(255,255,255,.025)}
tr.click{cursor:pointer}
td.mkt{max-width:340px;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input,.filters select,.seg button{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.filters input{min-width:0}
.seg{display:inline-flex;gap:0}
.seg button{border-radius:0;cursor:pointer;color:var(--text2)}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button+button{border-left:none}
.seg button.on{background:rgba(22,163,106,.18);color:var(--green2)}
.btn{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--green);border-color:var(--green)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--text2);font-size:12px}
.feed .item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--border)}
.feed .item:last-child{border:none}
.feed .meta{color:var(--muted);font-size:12px}
.cons{border-left:3px solid var(--green);background:var(--card2);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cons .row{display:flex;gap:14px;flex-wrap:wrap;color:var(--text2);font-size:12px;margin-top:6px}
.cons .t{font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;width:100px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--green)}
.empty{color:var(--muted);padding:24px;text-align:center}
.note{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:10px 14px;color:var(--text2);font-size:12.5px;margin-bottom:16px}
.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.35)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kv div small{display:block;color:var(--muted);font-size:11px}
.kv div b{font-weight:600}
.addr{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.panel{position:fixed;top:0;right:0;width:min(520px,100%);height:100vh;background:var(--side);border-left:1px solid var(--border);z-index:50;overflow:auto;padding:20px;transform:translateX(100%);transition:transform .18s}
.panel.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.scrim.open{display:block}
.loading{color:var(--text2);padding:30px;text-align:center}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--green2);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:16px}
.timeline .ev{position:relative;padding:6px 0}
.timeline .ev::before{content:"";position:absolute;left:-22px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--green)}
.timeline .ev.sell::before{background:var(--red)}
label.f{display:flex;flex-direction:column;gap:4px;color:var(--text2);font-size:12px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .side{position:fixed;left:0;z-index:60;transform:translateX(-100%);transition:transform .18s}
  .app.drawer .side{transform:none}
  .menu-btn{display:block}
  .top{padding:10px 16px}.content{padding:18px 16px 40px}
  .status .ts{display:none}
  .collapse-btn{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M3 17l6-6 4 4 8-8"/></svg></div><span>Wallet Intelligence</span></div>
    <nav class="nav" id="nav"></nav>
    <button class="collapse-btn" id="collapse" title="Collapse sidebar">⇤</button>
    <div class="foot">Read-only. Public Polymarket data. Not financial advice.</div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu-btn" id="menu" aria-label="Open navigation">☰</button>
      <div class="search">
        <input id="q" placeholder="Search wallets, addresses, markets…" autocomplete="off">
        <div class="results" id="results"></div>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="conn">Connecting…</span><span class="ts mut" id="updated"></span></div>
      <button class="bell" id="bell" aria-label="Notifications">🔔<span class="count" id="bellCount"></span></button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel"></aside>

<script>
"use strict";
// ---------- config & utils ----------
const API = "https://data-api.polymarket.com/v2";
const DEFAULTS = { topN: 50, period: "month", minWallets: 3, windowMin: 60, minTrade: 100, lookbackH: 24, browserNotify: false };
const store = {
  get(k, d) { try { const v = localStorage.getItem("pwt:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("pwt:" + k, JSON.stringify(v)); } catch {} }
};
let settings = { ...DEFAULTS, ...store.get("settings", {}) };

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (a) => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const usd = (n, d = 0) => n == null || isNaN(n) ? '<span class="mut">Unavailable</span>' :
  (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const usdC = (n) => { if (n == null || isNaN(n)) return usd(n); const a = Math.abs(n);
  const s = a >= 1e6 ? (a / 1e6).toFixed(2) + "M" : a >= 1e3 ? (a / 1e3).toFixed(1) + "K" : a.toFixed(0); return (n < 0 ? "-$" : "$") + s; };
const pnl = (n) => n == null ? usd(n) : `<span class="${n >= 0 ? "pos" : "neg"}">${n >= 0 ? "+" : ""}${usdC(n)}</span>`;
const num = (n) => n == null ? '<span class="mut">Unavailable</span>' : Math.round(n).toLocaleString("en-US");
const cents = (p) => p == null ? "—" : (p * 100).toFixed(1) + "¢";
const ago = (ms) => { const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return Math.floor(s) + "s ago"; if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago"; };
const dt = (ms) => new Date(ms).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- API client with retry/backoff ----------
const health = { ok: 0, failed: 0, lastSuccess: null, lastError: null, errors: [], syncing: false, lastCycleMs: null };
async function api(path, tries = 4) {
  let wait = 800;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(API + path);
      if (r.status === 429 || r.status === 503) {
        const ra = Number(r.headers.get("Retry-After")) || 0;
        await sleep(Math.max(ra * 1000, wait)); wait *= 2; continue;
      }
      if (!r.ok) throw new Error(`HTTP ${r.status} on ${path.split("?")[0]}`);
      const j = await r.json();
      health.ok++; health.lastSuccess = Date.now();
      return j;
    } catch (e) {
      if (i === tries - 1) {
        health.failed++; health.lastError = Date.now();
        health.errors.unshift({ at: Date.now(), msg: e.message || String(e) }); health.errors.length = Math.min(health.errors.length, 20);
        throw e;
      }
      await sleep(wait); wait *= 2;
    }
  }
  throw new Error("Rate limited: " + path.split("?")[0]);
}
async function pool(items, n, fn) {
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const k = i++; try { out[k] = await fn(items[k]); } catch (e) { out[k] = null; } } }));
  return out;
}

// ---------- consensus engine (port of src/lib/consensus/engine.ts) ----------
const W = { walletCount: 0.4, walletQuality: 0.3, sizeVsHistory: 0.15, dispersion: 0.15 };
class ConsensusEngine {
  constructor(config) { this.config = config; this.seen = new Set(); this.buckets = new Map(); this.history = new Map();
    this.tokensByCondition = new Map(); this.active = new Map(); this.nextId = 1; }
  static key(t) { return [t.transactionId, t.wallet, t.tokenId, t.side, t.shares, t.price].join("|"); }
  process(trade) {
    const t = { ...trade, wallet: trade.wallet.toLowerCase() }; const k = ConsensusEngine.key(t);
    if (this.seen.has(k)) return { kind: "ignored", reason: "duplicate" };
    const p = this.config.getWallet(t.wallet);
    if (!p) return { kind: "ignored", reason: "wallet not tracked" };
    if (p.rank > this.config.maxRank) return { kind: "ignored", reason: "rank" };
    if (t.side === "BUY" && t.usdc < this.config.minTradeUsd) return { kind: "ignored", reason: "size" };
    this.seen.add(k);
    if (!this.tokensByCondition.has(t.conditionId)) this.tokensByCondition.set(t.conditionId, new Set());
    this.tokensByCondition.get(t.conditionId).add(t.tokenId);
    const b = this.buckets.get(t.tokenId) ?? []; b.push({ trade: t, rank: p.rank });
    this.buckets.set(t.tokenId, this.prune(b, t.timestamp));
    let ev = this.active.get(t.tokenId);
    if (ev && t.timestamp - ev.latestTradeAt > this.config.windowMs) { this.active.delete(t.tokenId); ev = undefined; }
    const parts = ev ? this.participants((this.history.get(t.tokenId) ?? []).filter((e) => e.trade.timestamp >= ev.firstTradeAt))
                     : this.participants(this.buckets.get(t.tokenId));
    const q = parts.filter((x) => x.netUsd > 0);
    if (!ev) {
      if (q.length < this.config.minWallets) return { kind: "recorded" };
      const c = this.build(t, q, "ce" + this.nextId++, t.timestamp); this.active.set(t.tokenId, c); return { kind: "created", event: c };
    }
    const before = new Set(ev.participants.map((x) => x.wallet));
    const u = this.build(t, q, ev.id, ev.firstDetected); this.active.set(t.tokenId, u);
    const after = new Set(u.participants.map((x) => x.wallet));
    return { kind: "updated", event: u, walletsJoined: [...after].filter((w) => !before.has(w)), walletsLeft: [...before].filter((w) => !after.has(w)) };
  }
  prune(b, now) {
    const last = b[b.length - 1]; const h = this.history.get(last.trade.tokenId) ?? []; h.push(last);
    const a = this.active.get(last.trade.tokenId);
    const from = Math.min(now - this.config.windowMs, a?.firstTradeAt ?? Infinity);
    this.history.set(last.trade.tokenId, h.filter((e) => e.trade.timestamp >= from));
    return b.filter((e) => now - e.trade.timestamp <= this.config.windowMs);
  }
  participants(entries) {
    const m = new Map();
    for (const { trade: t, rank } of entries) {
      let p = m.get(t.wallet);
      if (!p) { p = { wallet: t.wallet, rankAtJoin: rank, boughtUsd: 0, soldUsd: 0, netUsd: 0, firstTradeAt: t.timestamp, latestTradeAt: t.timestamp, trades: [] }; m.set(t.wallet, p); }
      if (t.side === "BUY") p.boughtUsd += t.usdc; else p.soldUsd += t.usdc;
      p.netUsd = p.boughtUsd - p.soldUsd;
      p.firstTradeAt = Math.min(p.firstTradeAt, t.timestamp); p.latestTradeAt = Math.max(p.latestTradeAt, t.timestamp);
      p.trades.push(t);
    }
    return [...m.values()];
  }
  build(t, q, id, firstDetected) {
    const combined = q.reduce((s, p) => s + p.netUsd, 0);
    const c = this.score(q, combined);
    const w = c.sizeVsHistory === null
      ? (W.walletCount * c.walletCount + W.walletQuality * c.walletQuality + W.dispersion * c.dispersion) / (1 - W.sizeVsHistory)
      : W.walletCount * c.walletCount + W.walletQuality * c.walletQuality + W.sizeVsHistory * c.sizeVsHistory + W.dispersion * c.dispersion;
    return { id, conditionId: t.conditionId, tokenId: t.tokenId, outcome: t.outcome, title: t.title, slug: t.eventSlug,
      firstDetected, lastUpdated: t.timestamp,
      firstTradeAt: Math.min(...q.map((p) => p.firstTradeAt)), latestTradeAt: Math.max(...q.map((p) => p.latestTradeAt)),
      participants: q.sort((a, b) => b.netUsd - a.netUsd), distinctWallets: q.length, combinedNetUsd: combined,
      score: Math.round(w * 100), components: c, opposing: this.opposing(t) };
  }
  score(q, combined) {
    const walletCount = Math.min(q.length / 8, 1);
    const walletQuality = q.reduce((s, p) => s + Math.max(0, 1 - (p.rankAtJoin - 1) / this.config.maxRank), 0) / q.length;
    const ratios = [];
    for (const p of q) { const avg = this.config.getWallet(p.wallet)?.avgTradeUsd; if (avg > 0) ratios.push(Math.min(p.netUsd / avg / 3, 1)); }
    const sizeVsHistory = ratios.length ? ratios.reduce((a, b) => a + b, 0) / ratios.length : null;
    let dispersion = 1;
    if (q.length > 1 && combined > 0) {
      const h = q.reduce((s, p) => { const sh = p.netUsd / combined; return sh > 0 ? s - sh * Math.log(sh) : s; }, 0);
      dispersion = h / Math.log(q.length);
    }
    return { walletCount, walletQuality, sizeVsHistory, dispersion };
  }
  opposing(t) {
    const out = [];
    for (const o of this.tokensByCondition.get(t.conditionId) ?? []) {
      if (o === t.tokenId) continue;
      const es = (this.buckets.get(o) ?? []).filter((e) => t.timestamp - e.trade.timestamp <= this.config.windowMs);
      const ps = this.participants(es).filter((p) => p.netUsd > 0);
      if (ps.length) out.push({ tokenId: o, outcome: es[0].trade.outcome, distinctWallets: ps.length,
        combinedNetUsd: ps.reduce((s, p) => s + p.netUsd, 0), avgRank: ps.reduce((s, p) => s + p.rankAtJoin, 0) / ps.length, wallets: ps.map((p) => p.wallet) });
    }
    return out;
  }
}

// ---------- state ----------
const S = {
  wallets: new Map(),     // addr -> {address, rank, name, pnl, volume, avgTradeUsd, lastActive, tradeCount}
  trades: [],             // normalized, newest first
  tradeKeys: new Set(),
  cursors: new Map(),     // addr -> last seen ts (s)
  events: new Map(),      // id -> event
  alerts: store.get("alerts", []).slice(0, 200),
  ready: false, loadingMsg: "Loading leaderboard…", engine: null, booted: Date.now()
};
const unread = () => S.alerts.filter((a) => !a.read).length;

function normTrade(r) {
  const shares = Number(r.size), price = Number(r.price);
  return { transactionId: r.transaction_hash, wallet: (r.proxy_wallet || "").toLowerCase(), conditionId: r.condition_id, tokenId: r.token_id,
    outcome: r.outcome_index === 999 ? "Unlabeled" : (r.outcome || "Unlabeled"), outcomeIndex: r.outcome_index, side: r.side, shares, price,
    usdc: shares * price, timestamp: Number(r.timestamp) * 1000, title: r.title, slug: r.slug, eventSlug: r.event_slug, icon: r.icon };
}
function addTrades(list) {
  const fresh = [];
  for (const t of list) { const k = ConsensusEngine.key(t); if (S.tradeKeys.has(k)) continue; S.tradeKeys.add(k); fresh.push(t); }
  if (fresh.length) { S.trades.push(...fresh); S.trades.sort((a, b) => b.timestamp - a.timestamp); }
  return fresh;
}
function newEngine() {
  return new ConsensusEngine({ windowMs: settings.windowMin * 60000, minWallets: settings.minWallets, minTradeUsd: settings.minTrade,
    maxRank: settings.topN, getWallet: (a) => S.wallets.get(a) ?? null });

function feed(trades, live) {

function alertFor(ev, kind, live, joined = []) {

  const title = `${ev.distinctWallets} top wallets bought ${ev.outcome}`;
  const msg = kind === "joined" ? `${joined.map(wName).join(", ")} joined` : `Combined ${usdC(ev.combinedNetUsd)} within ${settings.windowMin} min`;
  if (a) { Object.assign(a, { title, msg, eventId: ev.id, market: ev.title, wallets: ev.distinctWallets, volume: ev.combinedNetUsd, score: ev.score, at: ev.lastUpdated, updates: (a.updates || 0) + 1, read: live ? false : a.read }); }
  else { a = { key, eventId: ev.id, title, msg, market: ev.title, outcome: ev.outcome, wallets: ev.distinctWallets, volume: ev.combinedNetUsd, score: ev.score, at: ev.lastUpdated, first: ev.firstTradeAt, read: !live, live, updates: 0 }; S.alerts.unshift(a); }

// ---------- data loading ----------
async function loadLeaderboard() {
  const rows = []; let cursor = null;
  while (rows.length < settings.topN) {
    const q = cursor ? `cursor=${encodeURIComponent(cursor)}` : `time_period=${settings.period}&sort_by=PNL&limit=${Math.min(100, settings.topN)}`;
    const j = await api(`/leaderboard?${q}`);
    rows.push(...(j.data || [])); cursor = j.pagination?.next_cursor; if (!cursor) break;
  }
  S.wallets.clear();
  rows.slice(0, settings.topN).forEach((r) => S.wallets.set(r.user_id.toLowerCase(), { address: r.user_id.toLowerCase(), rank: r.rank, name: r.user_name || "",
    pnl: r.pnl, volume: r.volume, x: r.x_username, verified: r.verified, avgTradeUsd: undefined, lastActive: null, tradeCount: 0 }));
}
async function fetchWalletTrades(addr, sinceSec) {
  const out = []; let cursor = null; const base = `/trades?user=${addr}&start=${sinceSec}&limit=500`;
  for (let page = 0; page < 6; page++) {
    const j = await api(base + (cursor ? `&cursor=${encodeURIComponent(cursor)}` : ""));
    out.push(...(j.data || []).map(normTrade)); cursor = j.pagination?.next_cursor; if (!cursor) break;
  }
  return out;
}
function walletStatsFromTrades() {
  for (const w of S.wallets.values()) { w.tradeCount = 0; w.lastActive = null; w.sum = 0; w.buys = 0; }
  for (const t of S.trades) { const w = S.wallets.get(t.wallet); if (!w) continue; w.tradeCount++; w.lastActive = Math.max(w.lastActive || 0, t.timestamp);
    if (t.side === "BUY") { w.sum += t.usdc; w.buys++; } }
  for (const w of S.wallets.values()) w.avgTradeUsd = w.buys ? w.sum / w.buys : undefined;
}
async function boot() {
  S.ready = false; S.trades = []; S.tradeKeys.clear(); S.events.clear(); S.cursors.clear();
  try {
    S.loadingMsg = "Loading leaderboard…"; render();
    await loadLeaderboard();
    const since = Math.floor(Date.now() / 1000) - settings.lookbackH * 3600;
    let done = 0; const addrs = [...S.wallets.keys()];
    await pool(addrs, 6, async (a) => {
      const ts = await fetchWalletTrades(a, since); addTrades(ts);
      S.cursors.set(a, ts.length ? Math.max(...ts.map((t) => t.timestamp / 1000)) : since);
      done++; S.loadingMsg = `Loading trades… ${done}/${addrs.length} wallets`; if (done % 5 === 0) render();
    });
    walletStatsFromTrades(); recompute(); S.ready = true; render(); setStatus();
  } catch (e) {
    S.loadingMsg = "Couldn't load Polymarket data: " + e.message; render(); setStatus();
  }
}
let polling = false;
async function poll() {
  if (!S.ready || polling || document.hidden) return; polling = true; health.syncing = true; const t0 = Date.now();
  try {
    const addrs = [...S.wallets.keys()]; const fresh = [];
    await pool(addrs, 5, async (a) => {
      const since = Math.floor(S.cursors.get(a) ?? Date.now() / 1000 - 3600) - 30; // small overlap; dedupe handles repeats
      const ts = await fetchWalletTrades(a, since); const f = addTrades(ts); fresh.push(...f);
      if (ts.length) S.cursors.set(a, Math.max(S.cursors.get(a) || 0, ...ts.map((t) => t.timestamp / 1000)));
    });
    // drop trades older than lookback to keep memory bounded
    const cutoff = Date.now() - settings.lookbackH * 3600e3;
    if (S.trades.length && S.trades[S.trades.length - 1].timestamp < cutoff) S.trades = S.trades.filter((t) => t.timestamp >= cutoff);
    if (fresh.length) { walletStatsFromTrades(); feed(fresh, true); render(true); }
  } finally { polling = false; health.syncing = false; health.lastCycleMs = Date.now() - t0; setStatus(); }
}

function marketGroups() {
  const m = new Map();
  for (const t of S.trades) {
    let g = m.get(t.conditionId); if (!g) { g = { conditionId: t.conditionId, title: t.title, slug: t.eventSlug, wallets: new Set(), vol: 0, n: 0, last: 0, outcomes: new Map() }; m.set(t.conditionId, g); }
    g.wallets.add(t.wallet); g.vol += t.usdc; g.n++; g.last = Math.max(g.last, t.timestamp);
    const o = g.outcomes.get(t.outcome) || { buy: 0, sell: 0, price: t.price, at: 0 }; if (t.side === "BUY") o.buy += t.usdc; else o.sell += t.usdc;
    if (t.timestamp > o.at) { o.at = t.timestamp; o.price = t.price; } g.outcomes.set(t.outcome, o);
  }
  return [...m.values()];
}

async function loadWallet(addr) {
  walletCache.set(addr, null);
  const c = { positions: null, trades: null };
  try {
    const [p, t] = await Promise.all([api(`/positions?user=${addr}&limit=100`), api(`/trades?user=${addr}&start=${Math.floor(Date.now() / 1000) - 30 * 86400}&limit=500`)]);
    c.positions = (p.data || []).filter((x) => x.status !== "CLOSED"); c.posMore = !!p.pagination?.has_more;
    c.trades = (t.data || []).map(normTrade).sort((a, b) => b.timestamp - a.timestamp); c.name = t.data?.[0]?.name;
  } catch (e) { c.positions = c.positions || []; c.trades = c.trades || []; c.err = "Couldn't load: " + e.message; }
  walletCache.set(addr, c);
  if (route().page === "wallet" && route().arg.toLowerCase() === addr) render();
}

      if (sel) { const i = document.querySelector(`[data-f="${sel[0]}"]`); i.focus(); try { i.setSelectionRange(sel[1], sel[1]); } catch {} } });
    $("#tsort").value = UI.tradeSort + ":" + UI.tradeDir;
    $("#tsort").onchange = (e) => { const [k, d] = e.target.value.split(":"); UI.tradeSort = k; UI.tradeDir = +d; render(); };
    $("#clearF").onclick = () => { UI.tf = { wallet: "", market: "", side: "", min: "", outcome: "" }; UI.tradePage = 0; render(); };
    $("#prev").onclick = () => { UI.tradePage--; render(); }; $("#next").onclick = () => { UI.tradePage++; render(); };
  }
  if (page === "consensus") {
    document.querySelectorAll("#cmin button").forEach((b) => b.onclick = () => { UI.consMin = +b.dataset.n; render(); });
    document.querySelectorAll("#cside button").forEach((b) => b.onclick = () => { UI.consSide = b.dataset.s; render(); });
  }
  if (page === "markets") $("#mq").oninput = (e) => { UI.marketQ = e.target.value; const p = e.target.selectionStart; render(); const i = $("#mq"); i.focus(); i.setSelectionRange(p, p); };
  if (page === "alerts") {
    $("#markAll").onclick = () => { S.alerts.forEach((a) => a.read = true); store.set("alerts", S.alerts); render(); };
    $("#clearAlerts").onclick = () => { S.alerts = []; store.set("alerts", S.alerts); render(); };
    document.querySelectorAll("[data-read]").forEach((a) => a.addEventListener("click", () => { const x = S.alerts.find((y) => y.key === a.dataset.read); if (x) { x.read = true; store.set("alerts", S.alerts); } }));
    const bn = $("#bn"); if (bn) bn.onclick = async () => {
      if (settings.browserNotify && Notification.permission === "granted") settings.browserNotify = false;
      else { const p = await Notification.requestPermission(); settings.browserNotify = p === "granted"; if (p !== "granted") alert("Browser notifications were blocked. You can allow them in your browser's site settings."); }
      store.set("settings", settings); render(); };
  }
  if (page === "wallet") { const c = $("#copy"); if (c) c.onclick = () => { navigator.clipboard?.writeText(route().arg); c.textContent = "Copied"; }; }
  if (page === "settings") {
    document.querySelectorAll(".set").forEach((el) => el.onchange = () => {
      const k = el.dataset.k; let v = el.dataset.str ? el.value : Number(el.value);
      if (k === "minWallets") v = Math.max(2, Math.min(20, v || 2)); if (k === "minTrade") v = Math.max(0, v || 0);
      settings[k] = v; store.set("settings", settings);
      if (el.dataset.reload) boot(); else { if (S.ready) recompute(); render(); }
    });
    $("#resetS").onclick = () => { settings = { ...DEFAULTS }; store.set("settings", settings); boot(); location.hash = "settings"; };
  }
}

// ---------- global search ----------
$("#q").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase(); const box = $("#results");
  if (!q) { box.style.display = "none"; return; }
  const out = [];
  if (/^0x[0-9a-f]{40}$/.test(q)) out.push(`<a href="#wallet/${q}">Open wallet ${short(q)}<small>Look up any public address</small></a>`);
  if (/^0x[0-9a-f]{64}$/.test(q)) { const t = S.trades.find((x) => x.transactionId?.toLowerCase() === q); if (t) out.push(`<a href="#" data-tx="${S.trades.indexOf(t)}">Transaction ${short(q)}<small>${esc(t.title)}</small></a>`); }
  for (const w of S.wallets.values()) if (w.address.includes(q) || (w.name || "").toLowerCase().includes(q)) { out.push(`<a href="#wallet/${w.address}">${esc(w.name || short(w.address))} <span class="mut">#${w.rank}</span><small class="addr">${w.address}</small></a>`); if (out.length > 8) break; }
  const seen = new Set();
  for (const t of S.trades) { if (seen.size >= 8) break; if (!seen.has(t.conditionId) && (t.title || "").toLowerCase().includes(q)) { seen.add(t.conditionId); out.push(`<a href="#market/${encodeURIComponent(t.conditionId)}">${esc(t.title)}<small>Market</small></a>`); } }
  box.innerHTML = out.join("") || `<div class="empty">No matches. Paste a full 0x address to look up any wallet.</div>`; box.style.display = "block";
  box.querySelectorAll("[data-tx]").forEach((a) => a.onclick = (ev) => { ev.preventDefault(); openTrade(S.trades[+a.dataset.tx]); box.style.display = "none"; });
});
$("#q").addEventListener("keydown", (e) => { if (e.key === "Enter") { const a = $("#results a"); if (a) a.click(); } });
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) $("#results").style.display = "none"; else if (e.target.closest("#results a")) { $("#results").style.display = "none"; $("#q").value = ""; } });
$("#bell").onclick = () => { location.hash = "alerts"; };
$("#menu").onclick = () => $("#app").classList.toggle("drawer");
$("#collapse").onclick = () => { $("#app").classList.toggle("collapsed"); store.set("collapsed", $("#app").classList.contains("collapsed")); };
if (store.get("collapsed", false)) $("#app").classList.add("collapsed");
document.addEventListener("click", (e) => { if ($("#app").classList.contains("drawer") && !e.target.closest(".side") && !e.target.closest("#menu")) $("#app").classList.remove("drawer"); });

// ---------- start ----------
render(); boot();
setInterval(poll, 60e3);
setInterval(() => { setStatus(); const { page } = route(); if (S.ready && ["overview", "consensus", "status"].includes(page)) render(true); }, 30e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
